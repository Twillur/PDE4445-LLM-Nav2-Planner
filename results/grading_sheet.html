#summary{display:none}
table{border-collapse:collapse;width:100%;margin-top:12px;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}

      <span class="tag">Level ${it.level}</span><span class="tag">${esc(it.id)}</span>
      ${it.clarification_ok?'<span class="tag">clarification acceptable</span>':''}
      <h2>${esc(it.command)}</h2>
      <div class="crit"><b>Rubric:</b> ${esc(it.criteria)}</div>
      <div class="k">understood: <b>${o.understood}</b>${o.clarification_question?` &nbsp;|&nbsp; asked: “${esc(o.clarification_question)}”`:''}</div>
      ${steps}
      ${o.notes?`<div class="k"><b>notes:</b> ${esc(o.notes)}</div>`:''}
      <div class="grade" style="margin-top:16px">
        <button class="p ${cur.score==='pass'?'on':''}"    onclick="setg('pass')">Pass</button>
        <button class="x ${cur.score==='partial'?'on':''}" onclick="setg('partial')">Partial</button>
        <button class="f ${cur.score==='fail'?'on':''}"    onclick="setg('fail')">Fail</button>
      </div>
      <textarea placeholder="Justification (recommended — this is your evidence trail)"
        oninput="note(this.value)">${esc(cur.note||"")}</textarea>
    </div>`;
  const n = Object.keys(g).filter(k=>g[k].score).length;
  document.getElementById("pos").textContent = `item ${i+1} of ${ITEMS.length}`;
  document.getElementById("cnt").textContent = `${n} graded`;
  document.getElementById("prog").style.width = (100*n/ITEMS.length)+"%";
}
function setg(s){ const k=ITEMS[i].key; g[k]=Object.assign({},g[k],{score:s}); save(); render(); setTimeout(()=>go(1),160); }
function note(v){ const k=ITEMS[i].key; g[k]=Object.assign({},g[k],{note:v}); save(); }
function go(d){ i=Math.max(0,Math.min(ITEMS.length-1,i+d)); document.getElementById("summary").style.display="none"; render(); }
function jumpNext(){ for(let j=0;j<ITEMS.length;j++){ const k=ITEMS[(i+1+j)%ITEMS.length].key; if(!g[k]||!g[k].score){ i=(i+1+j)%ITEMS.length; render(); return; } } alert("All graded."); }
function exportJSON(){
  const out = ITEMS.map(it=>({id:it.id,level:it.level,version:it.version,command:it.command,
    score:(g[it.key]||{}).score||null, note:(g[it.key]||{}).note||""}));
  const b=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="l45_grades.json"; a.click();
}
function reveal(){
  const t={};
  ITEMS.forEach(it=>{ const L="L"+it.level; t[L]=t[L]||{pass:0,partial:0,fail:0,ungraded:0};
    t[L][(g[it.key]||{}).score||"ungraded"]++; });
  const rows=Object.keys(t).sort().map(L=>
    `<tr><td><b>${L}</b></td><td>${t[L].pass}</td><td>${t[L].partial}</td><td>${t[L].fail}</td><td>${t[L].ungraded}</td></tr>`).join("");
  const el=document.getElementById("summary");
  el.innerHTML=`<h2>Grading summary (v2)</h2>
    <table><tr><th>level</th><th>pass</th><th>partial</th><th>fail</th><th>ungraded</th></tr>${rows}</table>
    <p class="k">Hit <b>Export JSON</b> to save, then send the file over.</p>`;
  el.style.display="block"; el.scrollIntoView({behavior:"smooth"});
}
document.addEventListener("keydown",e=>{ if(e.target.tagName==="TEXTAREA")return;
  if(e.key==="1")setg("pass"); if(e.key==="2")setg("partial"); if(e.key==="3")setg("fail");
  if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1); });
render();
</script></body></html>
