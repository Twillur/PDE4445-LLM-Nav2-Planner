<text x="855.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">TurtleBot3</text>
<text x="855.0" y="157" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">Waffle</text>
<line x1="767" y1="138.0" x2="787" y2="138.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#head)"/>
<text x="239.0" y="86" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="600">named locations only — coordinates never generated</text>
<line x1="547.0" y1="184" x2="547.0" y2="230" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#head)"/>
