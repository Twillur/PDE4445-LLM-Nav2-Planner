<text x="46" y="63" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="400">it never emits coordinates, so a hallucinated location fails map validation rather than driving the robot.</text>
