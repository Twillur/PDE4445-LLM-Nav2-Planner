<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="System architecture: natural language command through prompt assembly, a single LLM call, three validation gates and the executor into Nav2">
<rect width="940" height="400" fill="#fcfcfb"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs>
<text x="23" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">System architecture</text>
<text x="23" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="400">one LLM call per command; no agent loop, no re-prompting except a single bounded retry on invalid JSON</text>
<rect x="23" y="96" width="124" height="84" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="85.0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Operator</text>
<text x="85.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">natural-language</text>
<text x="85.0" y="157" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">command</text>
<rect x="177" y="96" width="124" height="84" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="239.0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">System prompt</text>
<text x="239.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">schema +</text>
<text x="239.0" y="157" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">20 named locations</text>
<line x1="151" y1="138.0" x2="171" y2="138.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="331" y="96" width="124" height="84" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="393.0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">LLM</text>
<text x="393.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">one call</text>
<text x="393.0" y="157" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">gpt-4o-mini, T=0</text>
