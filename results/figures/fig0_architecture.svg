<text x="547.0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Validation</text>
<text x="547.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">three gates</text>
<text x="547.0" y="157" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">(below)</text>
<line x1="459" y1="138.0" x2="479" y2="138.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#head)"/>
