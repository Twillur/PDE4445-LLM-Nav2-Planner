<text x="347" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">1. parse</text>
<text x="417" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="400">valid JSON returned</text>
<rect x="331" y="278" width="280" height="30" rx="6" fill="#fcfcfb" stroke="#3987e5" stroke-width="1.2"/>
<rect x="331" y="278" width="5" height="30" rx="2" fill="#3987e5"/>
