<text x="417" y="297" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="400">conforms to WaypointPlan</text>
<rect x="331" y="318" width="280" height="30" rx="6" fill="#fcfcfb" stroke="#86b6ef" stroke-width="1.2"/>
<rect x="331" y="318" width="5" height="30" rx="2" fill="#86b6ef"/>
<text x="347" y="337" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">3. map</text>
<text x="417" y="337" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="400">every target is a real location</text>
<text x="331" y="374" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="400" font-style="italic">any gate failing is recorded as a typed failure, not silently retried</text>
<path d="M505,184 L505,206 L85.0,206 L85.0,188" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#head)"/>
<text x="95.0" y="199" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">understood: false  →  clarification_question returned to the operator</text>
<rect x="633" y="250" width="160" height="74" rx="6" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="645" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">on_blocked</text>
<text x="645" y="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">abort · skip</text>
